      border: 1px solid var(--forest); border-radius: 8px;
      background: var(--forest); color: var(--sand);
      font-weight: 700; font-size: 14px; text-decoration: none;
      transition: background-color .15s, transform .15s, box-shadow .15s;
    }
    .btn:hover { background: var(--forest-hover); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(31,61,43,.35); }
    .btn:focus-visible { outline: 2px solid var(--forest); outline-offset: 3px; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .card, .bot { animation: none; } }
